name: Rust Build & Test

on:
  pull_request:
    types: 
      - "synchronize"

env:
  # BuildKit registry cache for the tester stage (deps-test cook + chef base).
  # publish.yml reads from this cache so the release retest skips the dep cook.
  CACHE_REF: ghcr.io/${{ github.repository }}/cache:tester

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Build & test (Docker tester)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build tester image, run tests, export cache
        uses: docker/build-push-action@v6
        with:
          context: .
          target: tester
          load: true
          tags: bigtent:tester
          cache-from: |
            type=registry,ref=${{ env.CACHE_REF }}
          cache-to: |
            type=registry,ref=${{ env.CACHE_REF }},mode=max
