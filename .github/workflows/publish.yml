name: Publish Rust Container Image

env:
  PLATFORMS: linux/amd64, linux/arm64
  # BuildKit registry cache populated by build.yml's tester build; reused
  # here for the release retest and the multi-arch image build so the dep
  # cook (chef base + deps-test) is skipped when unchanged.
  CACHE_REF: ghcr.io/${{ github.repository }}/cache:tester

on:
  push:
    tags: ["v*.*.*"] # Trigger only on semantic version tags

jobs:
  check-version:
    name: Ensure GitHub Release & Cargo.toml Version Numbers Match
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Check Cargo Version Matches Tag
        uses: spice-labs-inc/action-check-version@main

  push_to_dockerhub:
    name: Push Docker Image to Docker Hub
    runs-on: ubuntu-24.04
    needs: check-version

    permissions:
      contents: read
      attestations: write
      id-token: write
      packages: write

    steps:
      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: ${{ env.PLATFORMS }}

      - name: Checkout with LFS
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Retest (tester) reusing build cache
        uses: docker/build-push-action@v6
        with:
          context: .
          target: tester
          load: true
          tags: bigtent:tester
          cache-from: |
            type=registry,ref=${{ env.CACHE_REF }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: "${{ secrets.DOCKER_USERNAME }}"
          password: "${{ secrets.DOCKER_TOKEN }}"

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: spicelabs/bigtent
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=sha-${{ github.sha }}
          flavor: |
            latest=auto

      - name: Build and Push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ env.PLATFORMS }}
          context: .
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: |
            type=registry,ref=${{ env.CACHE_REF }}
          tags: "${{ steps.meta.outputs.tags }}"
          labels: "${{ steps.meta.outputs.labels }}"

      - name: Index and Upload ADG
        uses: spice-labs-inc/action-spice-labs-surveyor@v5
        with:
          spice_pass: "${{ secrets.SPICE_PASS }}"
          input: "."
          subject: "${{ github.event.repository.name }}"
