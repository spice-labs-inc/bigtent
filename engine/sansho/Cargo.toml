[package]
name = "sansho"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "A full-JMESPath projection engine for single CBOR documents"

[dependencies]
minicbor = { version = "2.3", features = ["std"] }
nom = "7"
serde_json = "1.0"

[dev-dependencies]
proptest = "1.5"
serde_cbor = "0.11"
hex-literal = "1"
criterion = "0.5"
jmespath = "0.5"

[[bench]]
name = "projection"
harness = false

[[bench]]
name = "comparison"
harness = false

[[bench]]
name = "source_paths"
harness = false
