[package]
name = "sansho"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "A full-JMESPath projection engine for single CBOR documents"

[dependencies]
minicbor = { version = "2.3", features = ["std"] }
nom = "7"
serde_cbor = "0.11"
serde_json = "1.0"
# the error taxonomy is serialised as itself (the row's `data` IS the error)
serde = { version = "1.0", features = ["derive", "rc"] }
# structured diagnostics: spans, labels, and renderers that are not hand-written prose
miette = { version = "7.6", features = ["derive"] }

[dev-dependencies]
proptest = "1.5"
hex-literal = "1"
criterion = "0.5"
jmespath = "0.5"

[[bench]]
name = "projection"
harness = false

[[bench]]
name = "comparison"
harness = false

[[bench]]
name = "source_paths"
harness = false

[[bench]]
name = "trait_surface"
harness = false
